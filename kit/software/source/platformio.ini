[platformio]
default_envs = xiao
core_dir = .pio-core

[env]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@1.4.2
    olikraus/U8g2@2.36.2
    adafruit/Adafruit NeoPixel@1.12.3
    bblanchon/ArduinoJson@6.21.5
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=3

[env:xiao]

[env:release]
build_flags =
    ${env.build_flags}
    -DMACROPAD_LOGGING=0

[env:sh1106]
build_flags =
    ${env.build_flags}
    -DMACROPAD_OLED_SH1106=1

[env:headless]
build_flags =
    ${env.build_flags}
    -DMACROPAD_OLED_ENABLED=0
